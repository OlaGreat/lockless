[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "london"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"

[fmt]
line_length = 100

# Fork tests execute Mezo's own contracts, which use newer opcodes than our london target.
[profile.fork]
evm_version = "cancun"
